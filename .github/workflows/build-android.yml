name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Debug Expo config
        continue-on-error: true
        run: |
          node node_modules/expo/bin/cli config --json > /tmp/expo-out.txt 2> /tmp/expo-err.txt
          echo "EXIT: $?"
          echo "=== STDOUT ===" && cat /tmp/expo-out.txt
          echo "=== STDERR ===" && cat /tmp/expo-err.txt

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Get build URL
        run: echo "✅ APK build started! Check https://expo.dev/accounts/adminkee/projects/mobile-fuel/builds for the download link."
