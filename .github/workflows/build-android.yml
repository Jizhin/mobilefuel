name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check project structure
        run: |
          echo "=== app.json ===" && cat app.json
          echo "=== package.json ===" && cat package.json
          echo "=== expo-location ===" && ls node_modules/expo-location || echo "MISSING"
          echo "=== expo-speech ===" && ls node_modules/expo-speech || echo "MISSING"

      - name: Debug Expo config
        run: npx expo config --json 2>&1 || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Get build URL
        run: echo "✅ APK build started! Check https://expo.dev/accounts/adminkee/projects/mobile-fuel/builds for the download link."
